name: iOS Build Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build JMA Finance for iPhone Simulator
        run: |
          xcodebuild \
            -project JMAFinance.xcodeproj \
            -scheme JMAFinance \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
